server:
  port: 9093
spring:
  application:
    name: tiktok-commodity
  servlet:
    multipart:
      max-file-size: 1024MB    #配置单个文件上传的大小限制
      max-request-size: 1024MB   #配置单个请求最大的文件大小限制
      enabled: true

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        import-check:
         enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dbtest
    username: root
    password: Minecraft333658

  data:
    redis:
      host: 127.0.0.1
      port: 16379  # Redis端口号
      password:  # 访问Redis所需密码
      database: 1 # 使用的数据库编号
      lettuce:
        pool:
          max-active: 8        # 连接池最大连接数(使用负值表示没有限制） 默认8
          max-wait: -1         # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-idle: 8          # 连接池最大空闲连接 默认8
          min-idle: 0          # 连接池最小空闲连接 默认 0
      timeout: 5000

mybatis:
    # mapper配置文件路径
  mapper-locations: classpath:mapper/**.xml
  type-aliases-package: com.example.tiktokuser.pojo.entity
  configuration:
      # 开启驼峰命名
    map-underscore-to-camel-case: true